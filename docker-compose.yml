version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - mongo_uri=${MONGO_URI}
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - velocifieet

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - velocifieet

networks:
  velocifieet:
    driver: bridge